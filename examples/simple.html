<!DOCTYPE html>
<html> 
<head> 
	<title>Simple Example</title> 

	<script src="js/three.min.js"></script>
	<script src="js/RoutesAdapter.js"></script>
	<script src="../src/StreetViewTileLoader.js"></script>
	<script src="../src/Hyperlapse.js"></script>
	<script> 
		function getQueryParam(name) {
			var params = new URLSearchParams(window.location.search);
			return params.get(name);
		}

		function loadGoogleMaps(callback) {
			var key = getQueryParam("key");
			var script = document.createElement("script");

			if (!key) {
				console.log("Missing API key. Open with ?key=YOUR_GOOGLE_MAPS_API_KEY.");
				return;
			}

			window.__hyperlapseSimpleInit = callback;
			script.src = "https://maps.googleapis.com/maps/api/js?key=" +
				encodeURIComponent(key) + "&v=weekly&loading=async&libraries=geometry&callback=__hyperlapseSimpleInit";
			script.async = true;
			document.head.appendChild(script);
		}

		function init() {
			var key = getQueryParam("key");

			var hyperlapse = new Hyperlapse(document.getElementById('pano'), {
				lookat: new google.maps.LatLng(37.81409525128964,-122.4775045005249),
				zoom: 1,
				use_lookat: true,
				elevation: 50,
				streetViewApiKey: key
			});

			hyperlapse.onError = function(e) {
				console.log(e);
			};

			hyperlapse.onRouteComplete = function(e) {
				hyperlapse.load();
			};

			hyperlapse.onLoadComplete = function(e) {
				hyperlapse.play();
			};

			// Google Maps API stuff here...
			var route = {
				request:{
					origin: new google.maps.LatLng(37.816480000000006,-122.47825,37),
					destination: new google.maps.LatLng(37.81195,-122.47773000000001),
					travelMode: "DRIVING"
				}
			};

			GoogleRoutesAdapter.computeRoute(route.request).then(function(response) {
				hyperlapse.generate( {route:response} );
			}).catch(function(error) {
				console.log(error.message);
			});

		}

		window.onload = function() {
			loadGoogleMaps(init);
		};
		
	</script> 
</head> 
<body> 
	<div id="pano"></div>
</body> 
</html>
